name: Exact interval compatibility check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  idris2-compatibility:
    runs-on: ubuntu-latest
    container: ghcr.io/stefan-hoeck/idris2-pack@sha256:6f38bafc229bcf031c1dca792bf71679d51ca547203480d54ac42535bfbfca16
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Compile Idris 2 compatibility proofs
        run: idris2 --build intervals.ipkg
      - name: Execute checked compatibility program
        run: ./build/exec/interval-tests
